<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Демонстрационная электронная книга FlipBook" />
    <title>FlipBook — Истории в движении</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#book" aria-label="FlipBook, к началу"><span class="brand-mark" aria-hidden="true">F</span><span>flipbook</span></a>
        <p class="edition">DEMO EDITION <span>•</span> 2024</p>
      </header>
      <section class="reader" id="reader" aria-labelledby="book-title">
        <div class="book-meta">
          <p class="eyebrow">ЦИФРОВОЙ ЖУРНАЛ</p>
          <h1 id="book-title">Тихие<br /><em>маршруты</em></h1>
          <p class="subtitle">Четыре заметки о местах, где время течёт немного медленнее.</p>
        </div>
        <div class="book-scene" id="book" aria-live="polite" aria-label="Книга закрыта. Обложка. Положение 1 из 4">
          <div class="book-shadow" aria-hidden="true"></div>
          <div class="book-block" id="bookBlock">
            <div class="page-bed page-bed--left" aria-hidden="true"></div>
            <div class="page-bed page-bed--right" aria-hidden="true"></div>
            <div class="leaves" id="leaves"></div>
            <div class="book-spine" aria-hidden="true"></div>
          </div>
        </div>
        <nav class="controls" aria-label="Управление книгой">
          <button class="nav-button" id="prevButton" type="button" aria-label="Предыдущий лист"><span aria-hidden="true">←</span> Назад</button>
          <div class="pagination" aria-label="Текущее положение"><span id="pageNumber">01</span><span class="page-divider">/</span><span id="pageTotal">04</span></div>
          <button class="nav-button nav-button--next" id="nextButton" type="button" aria-label="Следующий лист">Вперёд <span aria-hidden="true">→</span></button>
        </nav>
        <button class="fullscreen-button" id="fullscreenButton" type="button"><span aria-hidden="true">⛶</span> <span id="fullscreenLabel">Книга на весь экран</span></button>
        <p class="hint">Используйте стрелки клавиатуры или проведите пальцем</p>
      </section>
    </main>
    <script src="script.js?v=5"></script>
  </body>
</html>
